document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

, Arial, sans-serif;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* ---------- Type scale (display / serif) ---------- */\n  --display-1:  clamp(56px, 8vw, 112px);   /* hero */\n  --display-2:  clamp(44px, 6vw, 80px);\n  --h1:         clamp(36px, 4.4vw, 60px);\n  --h2:         clamp(28px, 3.2vw, 44px);\n  --h3:         clamp(22px, 2.4vw, 32px);\n  --eyebrow:    13px;   /* uppercase tracked */\n\n  /* ---------- Type scale (body / sans) ---------- */\n  --body-lg:    19px;\n  --body:       16px;\n  --body-sm:    14px;\n  --caption:    12px;\n\n  /* ---------- Tracking ---------- */\n  --track-tight:    -0.01em;\n  --track-normal:    0;\n  --track-wide:      0.08em;\n  --track-wider:     0.18em;     /* eyebrows */\n\n  /* ---------- Leading ---------- */\n  --lh-display: 1.02;\n  --lh-heading: 1.1;\n  --lh-body:    1.55;\n  --lh-tight:   1.25;\n\n  /* ---------- Spacing scale (8pt base, with 4 in/out) ---------- */\n  --s-0:  0;\n  --s-1:  4px;\n  --s-2:  8px;\n  --s-3:  12px;\n  --s-4:  16px;\n  --s-5:  24px;\n  --s-6:  32px;\n  --s-7:  48px;\n  --s-8:  64px;\n  --s-9:  96px;\n  --s-10: 128px;\n  --s-11: 192px;\n\n  /* ---------- Radii ---------- */\n  --r-1: 2px;\n  --r-2: 4px;\n  --r-3: 8px;\n  --r-4: 12px;\n  --r-5: 18px;     /* default for cards / buttons */\n  --r-6: 28px;     /* hero cards / image vignettes */\n  --r-pill: 999px;\n\n  /* ---------- Shadows (warm-tinted, never neutral grey) ---------- */\n  --shadow-1: 0 1px 2px rgba(63, 57, 56, 0.06),\n              0 1px 1px rgba(63, 57, 56, 0.04);\n  --shadow-2: 0 4px 10px rgba(63, 57, 56, 0.07),\n              0 2px 4px rgba(63, 57, 56, 0.05);\n  --shadow-3: 0 12px 28px rgba(63, 57, 56, 0.12),\n              0 4px 10px rgba(63, 57, 56, 0.06);\n  --shadow-4: 0 24px 56px rgba(31, 27, 26, 0.22),\n              0 8px 18px rgba(31, 27, 26, 0.10);\n  --shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.5),\n                  inset 0 -1px 0 rgba(63, 57, 56, 0.06);\n\n  /* ---------- Motion ---------- */\n  --ease-out:   cubic-bezier(.22, .61, .36, 1);\n  --ease-in-out: cubic-bezier(.65, 0, .35, 1);\n  --ease-quiet: cubic-bezier(.4, .0, .2, 1);\n  --dur-1: 120ms;\n  --dur-2: 220ms;\n  --dur-3: 360ms;\n  --dur-4: 600ms;\n}\n\n/* ===============================================================\n   Base elements — apply visual identity automatically\n   =============================================================== */\nhtml, body {\n  background: var(--surface-page);\n  color: var(--fg-1);\n  font-family: var(--font-body);\n  font-size: var(--body);\n  line-height: var(--lh-body);\n  font-feature-settings: \"kern\", \"liga\", \"calt\";\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  color: var(--fg-1);\n  font-weight: 500;\n  letter-spacing: var(--track-tight);\n  line-height: var(--lh-heading);\n  margin: 0 0 0.5em;\n  text-wrap: balance;\n}\nh1 { font-size: var(--h1); line-height: var(--lh-display); }\nh2 { font-size: var(--h2); }\nh3 { font-size: var(--h3); }\nh4 { font-family: var(--font-body); font-size: var(--body-lg); font-weight: 600; letter-spacing: 0; }\n\n.display-1 { font-family: var(--font-display); font-size: var(--display-1); line-height: var(--lh-display); letter-spacing: var(--track-tight); }\n.display-2 { font-family: var(--font-display); font-size: var(--display-2); line-height: var(--lh-display); letter-spacing: var(--track-tight); }\n\n.eyebrow {\n  font-family: var(--font-body);\n  font-size: var(--eyebrow);\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: var(--track-wider);\n  color: var(--fg-accent);\n}\n\np { margin: 0 0 1em; max-width: 64ch; text-wrap: pretty; }\nsmall, .caption { font-size: var(--caption); color: var(--fg-2); }\n\na {\n  color: var(--link);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  transition: color var(--dur-1) var(--ease-out);\n}\na:hover { color: var(--link-hover); }\n\n::selection { background: var(--cr-gold); color: var(--cr-ink); }\n<\/style>\n<style>/* =========================================================\n   The Cardinal Reserve — site shell\n   Shared header, footer, buttons, type, layout primitives.\n   ========================================================= */\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; }\nbody { overflow-x: hidden; }\n\n/* ---------- Tweak-driven overrides ---------- */\n:root {\n  --pattern-opacity: 0.10;\n  --hero-dark: 1;        /* 1 = dark hero, 0 = light */\n  --listings-cols: 2;\n  --cr-cardinal-current: var(--cr-cardinal);\n}\nbody[data-accent=\"soft\"]   { --cr-cardinal-current: #a8333a; }\nbody[data-accent=\"normal\"] { --cr-cardinal-current: #840001; }\nbody[data-accent=\"bold\"]   { --cr-cardinal-current: #5e0001; }\nbody[data-pattern=\"off\"]   { --pattern-opacity: 0; }\nbody[data-hero-mode=\"light\"] { --hero-dark: 0; }\n\n/* ---------- Layout primitives ---------- */\n.container { max-width: 1240px; margin: 0 auto; padding: 0 40px; }\n.container-wide { max-width: 1440px; margin: 0 auto; padding: 0 40px; }\n.container-tight { max-width: 920px; margin: 0 auto; padding: 0 40px; }\n.section { padding: 120px 0; }\n.section.tight { padding: 80px 0; }\n.section.compact { padding: 56px 0; }\n.section.dark { background: var(--cr-charcoal); color: var(--cr-cream); }\n.section.ink  { background: var(--cr-ink); color: var(--cr-cream); }\n.section.tan  { background: var(--cr-tan-soft); }\n.section.paper { background: var(--cr-paper); }\n.section.dark h1, .section.dark h2, .section.dark h3,\n.section.ink  h1, .section.ink  h2, .section.ink  h3 { color: var(--cr-cream); }\n.section.dark p, .section.ink p { color: var(--fg-on-dark-2); }\n\n.eyebrow-rule {\n  display: inline-flex; align-items: center; gap: 14px;\n  font-size: 12px; font-weight: 600; letter-spacing: 0.22em;\n  text-transform: uppercase; color: var(--cr-cardinal-current);\n}\n.eyebrow-rule::before { content:\"\"; width: 40px; height: 1px; background: var(--cr-gold); }\n.section.dark .eyebrow-rule, .section.ink .eyebrow-rule { color: var(--cr-gold); }\n\n.gold-rule { display: block; width: 56px; height: 1px; background: var(--cr-gold); margin: 0 0 22px; }\n.gold-rule.center { margin-left: auto; margin-right: auto; }\n\n/* ---------- Buttons ---------- */\n.btn {\n  font-family: var(--font-body);\n  font-size: 12px; font-weight: 600;\n  letter-spacing: 0.18em; text-transform: uppercase;\n  padding: 15px 26px;\n  border-radius: 999px;\n  border: 1px solid transparent;\n  cursor: pointer;\n  text-decoration: none;\n  display: inline-flex; align-items: center; gap: 10px;\n  transition: background var(--dur-2) var(--ease-out),\n              color var(--dur-2) var(--ease-out),\n              border-color var(--dur-2) var(--ease-out);\n}\n.btn-primary { background: var(--cr-cardinal-current); color: #fff; }\n.btn-primary:hover { background: var(--cr-cardinal-deep); color: #fff; }\n.btn-outline-light { background: transparent; color: var(--cr-cream); border-color: rgba(229,225,220,0.5); }\n.btn-outline-light:hover { background: var(--cr-cream); color: var(--cr-charcoal); border-color: var(--cr-cream); }\n.btn-outline-dark { background: transparent; color: var(--cr-charcoal); border-color: var(--cr-charcoal); }\n.btn-outline-dark:hover { background: var(--cr-charcoal); color: var(--cr-cream); }\n.btn-ghost { background: transparent; color: var(--cr-charcoal); padding: 14px 4px; }\n.btn-ghost:hover { color: var(--cr-cardinal-current); }\n.btn .arrow { display: inline-block; transition: transform var(--dur-2) var(--ease-out); }\n.btn:hover .arrow { transform: translateX(4px); }\n\n/* ---------- Nav header ---------- */\n.nav {\n  position: fixed; inset: 0 0 auto 0; z-index: 60;\n  transition: background var(--dur-3) var(--ease-out),\n              border-color var(--dur-3) var(--ease-out),\n              backdrop-filter var(--dur-3) var(--ease-out),\n              padding var(--dur-3) var(--ease-out);\n}\n.nav.solid {\n  background: rgba(229,225,220,0.94);\n  backdrop-filter: saturate(140%) blur(16px);\n  -webkit-backdrop-filter: saturate(140%) blur(16px);\n  border-bottom: 1px solid var(--border-soft);\n}\n.nav.over-dark { background: linear-gradient(to bottom, rgba(31,27,26,0.72) 0%, rgba(31,27,26,0.55) 60%, rgba(31,27,26,0.0) 100%); }\n.nav.over-dark.solid { background: rgba(31,27,26,0.86); border-bottom-color: rgba(229,225,220,0.12); backdrop-filter: saturate(140%) blur(16px); }\n.nav.over-dark .nav-link { color: var(--cr-cream); }\n.nav.over-dark .nav-link:hover { color: var(--cr-gold); }\n.nav.over-dark .nav-cta { background: var(--cr-cardinal-current); color: #fff; }\n\n.nav-inner {\n  max-width: 1440px; margin: 0 auto;\n  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;\n  padding: 14px 40px;\n  transition: padding var(--dur-3) var(--ease-out);\n}\n.nav.solid .nav-inner { padding: 10px 40px; }\n.nav-brand {\n  justify-self: center; display: flex; align-items: center;\n  text-decoration: none; padding: 4px 0;\n  transition: transform var(--dur-3) var(--ease-out);\n}\n.nav-logo { height: 58px; width: auto; display: block; transition: height var(--dur-3) var(--ease-out); }\n.nav.solid .nav-logo { height: 46px; }\n.nav-logo-light { display: none; }\n.nav.over-dark .nav-logo-dark { display: none; }\n.nav.over-dark .nav-logo-light { display: block; }\n\n.nav-links {\n  display: flex; gap: 32px; align-items: center;\n  justify-self: end;\n}\n.nav-primary {\n  display: flex; gap: 32px; align-items: center;\n  justify-self: start;\n}\n.nav-link {\n  font-family: var(--font-body);\n  font-size: 11px; font-weight: 600;\n  letter-spacing: 0.22em; text-transform: uppercase;\n  color: var(--fg-1); text-decoration: none;\n  transition: color var(--dur-2) var(--ease-out);\n  position: relative;\n  padding: 6px 2px;\n}\n.nav-link:hover, .nav-link[aria-current=\"page\"] { color: var(--cr-cardinal-current); }\n.nav-link[aria-current=\"page\"]::after {\n  content:\"\"; position: absolute; left: 0; right: 0; bottom: -2px;\n  height: 1px; background: var(--cr-cardinal-current);\n}\n.nav.over-dark .nav-link[aria-current=\"page\"] { color: var(--cr-gold); }\n.nav.over-dark .nav-link[aria-current=\"page\"]::after { background: var(--cr-gold); }\n.nav.solid .nav-link[aria-current=\"page\"] { color: var(--cr-cardinal-current); }\n.nav.solid .nav-link[aria-current=\"page\"]::after { background: var(--cr-cardinal-current); }\n.nav-cta {\n  background: var(--cr-cardinal-current); color: #fff;\n  padding: 11px 20px; border-radius: 999px;\n  font-size: 10px; font-weight: 600;\n  letter-spacing: 0.22em; text-transform: uppercase;\n  text-decoration: none;\n  transition: background var(--dur-2) var(--ease-out);\n  display: inline-flex; align-items: center; gap: 8px;\n}\n.nav-cta:hover { background: var(--cr-cardinal-deep); color: #fff; }\n.nav-cta .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--cr-gold); }\n\n.nav-toggle { display: none; background: none; border: none; color: inherit; cursor: pointer; padding: 8px; }\n  .nav.over-dark .nav-toggle, .nav.over-dark .nav-toggle svg { color: var(--cr-cream); stroke: var(--cr-cream); }\n  .nav-toggle svg {\n    width: 24px; height: 24px; display: block;\n    fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round;\n  }\n  .nav-toggle svg path { transition: transform var(--dur-2) var(--ease-out), opacity var(--dur-1) linear; transform-origin: center; }\n  body.menu-open .nav-toggle .bar-top { transform: translateY(6px) rotate(45deg); }\n  body.menu-open .nav-toggle .bar-mid { opacity: 0; }\n  body.menu-open .nav-toggle .bar-bot { transform: translateY(-6px) rotate(-45deg); }\n\n  /* ---------- Mobile menu ---------- */\n  .mobile-menu {\n    display: none;\n    position: fixed; left: 0; right: 0; top: 0; z-index: 55;\n    background: rgba(31,27,26,0.98);\n    backdrop-filter: saturate(140%) blur(18px);\n    border-bottom: 1px solid rgba(250,205,114,0.22);\n    padding: 84px 24px 26px;\n    max-height: 100vh; overflow-y: auto;\n    visibility: hidden;\n    transform: translateY(-101%);\n    transition: transform var(--dur-3) var(--ease-out), visibility var(--dur-3) linear;\n  }\n  .mobile-menu.open { visibility: visible; transform: translateY(0); }\n  @supports (height: 100dvh) { .mobile-menu { max-height: 100dvh; } }\n  .mobile-menu nav { display: flex; flex-direction: column; }\n  .mobile-menu a {\n    font-family: var(--font-body);\n    font-size: 13px; font-weight: 600;\n    letter-spacing: 0.20em; text-transform: uppercase;\n    color: var(--cr-cream); text-decoration: none;\n    padding: 17px 4px;\n    border-bottom: 1px solid rgba(229,225,220,0.10);\n  }\n  .mobile-menu a[aria-current=\"page\"] { color: var(--cr-gold); }\n  .mobile-menu .mm-cta {\n    margin-top: 22px; border-bottom: none; text-align: center;\n    background: var(--cr-cardinal-current); color: #fff;\n    border-radius: 999px; padding: 17px 20px;\n  }\n  body.menu-open { overflow: hidden; }\n  body.menu-open .nav { background: transparent; border-bottom-color: transparent; color: var(--cr-cream); }\n  body.menu-open .nav .nav-logo-dark { display: none; }\n  body.menu-open .nav .nav-logo-light { display: block; }\n  @media (max-width: 980px) { .mobile-menu { display: block; } }\n\n@media (max-width: 980px) {\n  .nav-inner { display: flex; align-items: center; justify-content: space-between; grid-template-columns: none; padding: 10px 20px; } .nav-brand { justify-self: start; }\n  .nav-primary, .nav-links { display: none; }\n  .nav-toggle { display: inline-flex; justify-self: end; }\n  .nav-logo { height: 44px; }\n}\n\n/* ---------- Footer ---------- */\n.footer { background: var(--cr-ink); color: var(--cr-cream); padding: 96px 0 36px; position: relative; }\n.footer::before {\n  content:\"\"; position: absolute; inset: 0;\n  background: url(\"69e36d65-002d-4569-85c7-70b06417028a\") center/360px;\n  opacity: calc(var(--pattern-opacity) * 0.8);\n  pointer-events: none;\n}\n.footer .container { position: relative; }\n.footer-top {\n  display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 56px;\n}\n.footer img.f-logo { height: 80px; margin-bottom: 22px; opacity: 0.96; display: block; }\n.footer h5 {\n  font-family: var(--font-body); font-size: 11px; font-weight: 600;\n  letter-spacing: 0.22em; text-transform: uppercase; color: var(--cr-gold);\n  margin: 0 0 22px;\n}\n.footer ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }\n.footer a {\n  color: var(--cr-cream); text-decoration: none; font-size: 14px;\n  opacity: 0.82; transition: opacity var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);\n}\n.footer a:hover { opacity: 1; color: var(--cr-gold); }\n.footer .addr { font-size: 14px; line-height: 1.7; color: var(--fg-on-dark-2); max-width: 30ch; }\n.footer .addr a { color: var(--cr-gold); opacity: 1; }\n\n.footer-bottom {\n  margin-top: 72px; padding-top: 28px;\n  border-top: 1px solid rgba(229,225,220,0.14);\n  display: flex; justify-content: space-between; align-items: center;\n  font-size: 12px; color: var(--fg-on-dark-3); letter-spacing: 0.08em;\n}\n.footer-bottom .social { display: flex; gap: 18px; }\n.footer-bottom .social a { display: inline-flex; align-items: center; gap: 8px; opacity: 0.74; }\n.footer-bottom .social svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.5; }\n\n/* ---------- Page banner (interior headers) ---------- */\n.page-banner {\n  background: var(--cr-charcoal); color: var(--cr-cream);\n  padding: clamp(150px, 24vh, 220px) 0 clamp(72px, 12vh, 120px);\n  position: relative; overflow: hidden;\n}\n.page-banner::before {\n  content:\"\"; position: absolute; inset: 0;\n  background: url(\"69e36d65-002d-4569-85c7-70b06417028a\") center/360px;\n  opacity: var(--pattern-opacity); pointer-events: none;\n}\n.page-banner::after {\n  content:\"\"; position: absolute; left: 0; right: 0; bottom: 0; height: 120px;\n  background: linear-gradient(to bottom, transparent, rgba(31,27,26,0.5));\n  pointer-events: none;\n}\n.page-banner .inner { position: relative; max-width: 1240px; margin: 0 auto; padding: 0 40px; }\n.page-banner h1 {\n  font-family: var(--font-display); color: var(--cr-cream);\n  font-size: clamp(56px, min(7vw, 12vh), 104px); margin: 18px 0 14px;\n  font-weight: 500; line-height: 1.0; letter-spacing: -0.015em;\n  max-width: 14ch;\n}\n.page-banner h1 em { font-style: italic; color: var(--cr-gold); font-weight: 400; }\n.page-banner p.lede {\n  font-size: 18px; line-height: 1.6; color: var(--fg-on-dark-2);\n  margin: 26px 0 0; max-width: 56ch;\n}\n.page-banner .eyebrow-rule { color: var(--cr-gold); }\n.page-banner .crumbs {\n  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--fg-on-dark-3); margin-bottom: 28px;\n  display: flex; align-items: center; gap: 10px;\n}\n.page-banner .crumbs a { color: var(--fg-on-dark-2); text-decoration: none; }\n.page-banner .crumbs a:hover { color: var(--cr-gold); }\n.page-banner .crumbs span { color: var(--cr-gold); }\n\n/* ---------- Section heads (centered) ---------- */\n.sec-head { text-align: center; margin-bottom: 72px; }\n.sec-head .eyebrow-rule { justify-content: center; }\n.sec-head .eyebrow-rule { display: inline-flex; align-items: center; gap: 14px; }\n.sec-head .eyebrow-rule::after { content:\"\"; width: 40px; height: 1px; background: var(--cr-gold); }\n.sec-head h2 {\n  font-family: var(--font-display); font-weight: 500;\n  font-size: clamp(40px, 4.6vw, 64px); margin: 22px 0 16px;\n  line-height: 1.04; letter-spacing: -0.014em;\n}\n.sec-head p {\n  margin: 0 auto; max-width: 60ch; color: var(--fg-2);\n  font-size: 17px; line-height: 1.6;\n}\n.section.dark .sec-head p, .section.ink .sec-head p { color: var(--fg-on-dark-2); }\n\n/* ---------- Listing card (used on Home + Listings) ---------- */\n.listing {\n  display: block; text-decoration: none; color: inherit;\n  background: var(--cr-paper);\n  border: 1px solid var(--border-soft);\n  border-radius: 18px;\n  overflow: hidden;\n  box-shadow: var(--shadow-1);\n  transition: box-shadow var(--dur-3) var(--ease-out),\n              border-color var(--dur-3) var(--ease-out),\n              transform var(--dur-3) var(--ease-out);\n  position: relative;\n}\n.listing:hover { box-shadow: var(--shadow-3); border-color: var(--border-strong); }\n.listing:hover .l-photo .vignette { transform: scale(1.04); }\n.l-photo {\n  aspect-ratio: 4/3;\n  position: relative; overflow: hidden;\n  background: var(--cr-charcoal);\n}\n.l-photo .vignette {\n  position: absolute; inset: 0;\n  transition: transform var(--dur-4) var(--ease-out);\n}\n.l-photo .pattern {\n  position: absolute; inset: 0;\n  background: url(\"69e36d65-002d-4569-85c7-70b06417028a\") center/220px;\n  opacity: calc(var(--pattern-opacity) * 1.2);\n  pointer-events: none;\n}\n.l-photo .stamp {\n  position: absolute; left: 22px; bottom: 18px;\n  font-family: var(--font-display); font-size: 13px;\n  color: var(--cr-gold); letter-spacing: 0.04em;\n  text-shadow: 0 2px 12px rgba(0,0,0,0.5);\n}\n.l-photo .stamp span { color: rgba(229,225,220,0.75); margin: 0 8px; }\n.l-tag {\n  position: absolute; top: 18px; left: 18px;\n  display: inline-flex; align-items: center; gap: 8px;\n  background: var(--cr-gold); color: var(--cr-ink);\n  font-size: 10px; font-weight: 600; letter-spacing: 0.18em;\n  text-transform: uppercase; padding: 7px 12px; border-radius: 4px;\n}\n.l-tag svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.8; }\n.l-body { padding: 26px 28px 28px; }\n.l-eyebrow {\n  font-size: 11px; font-weight: 600; letter-spacing: 0.20em;\n  text-transform: uppercase; color: var(--cr-cardinal-current);\n}\n.l-body h3 {\n  font-family: var(--font-display); font-weight: 500;\n  font-size: 32px; line-height: 1.08; margin: 10px 0 12px;\n  letter-spacing: -0.012em;\n}\n.l-body .meta {\n  display: flex; flex-wrap: wrap; gap: 8px 18px;\n  font-size: 13px; color: var(--fg-2);\n}\n.l-body .meta span { display: inline-flex; align-items: center; gap: 8px; }\n.l-body .meta svg { width: 14px; height: 14px; stroke: var(--fg-3); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }\n.l-foot {\n  display: flex; align-items: center; justify-content: space-between;\n  margin-top: 24px; padding-top: 20px;\n  border-top: 1px solid var(--border-soft);\n}\n.l-foot .from {\n  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3);\n}\n.l-foot .price {\n  font-family: var(--font-display); font-size: 28px;\n  color: var(--cr-cardinal-current); letter-spacing: -0.006em; line-height: 1;\n}\n.l-foot .price small {\n  font-family: var(--font-body); font-size: 11px; color: var(--fg-3);\n  margin-left: 6px; letter-spacing: 0.04em;\n}\n.l-foot .arrow {\n  font-size: 11px; font-weight: 600; letter-spacing: 0.20em;\n  text-transform: uppercase; color: var(--cr-cardinal-current);\n  display: inline-flex; align-items: center; gap: 8px;\n}\n.listing:hover .arrow .a { transform: translateX(4px); }\n.arrow .a { display: inline-block; transition: transform var(--dur-2) var(--ease-out); }\n\n/* Editorial 2-column listing variant */\n.listings-grid.cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 56px 48px; }\n.listings-grid.cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 32px; }\n.listings-grid.cols-2 .listing .l-photo { aspect-ratio: 4/3; }\n.listings-grid.cols-2 .listing .l-body { padding: 32px 36px 36px; }\n.listings-grid.cols-2 .listing .l-body h3 { font-size: 40px; }\n.listings-grid.cols-3 .listing .l-body h3 { font-size: 26px; }\n\n/* Vignette palettes — placeholder room photography */\n.v-bourbon { background:\n  radial-gradient(ellipse at 30% 40%, #8a4b1c 0%, transparent 55%),\n  linear-gradient(140deg, #2c1d1d 0%, #4b3522 50%, #6a3a1c 100%); }\n.v-velvet { background:\n  radial-gradient(ellipse at 70% 30%, #a8333a 0%, transparent 60%),\n  linear-gradient(140deg, #1f1b1a 0%, #4a2424 60%, #5e0001 100%); }\n.v-parlor { background:\n  radial-gradient(ellipse at 40% 70%, #d3b78f 0%, transparent 55%),\n  linear-gradient(140deg, #3F3938 0%, #5e4a3a 60%, #8a6740 100%); }\n.v-corner { background:\n  radial-gradient(ellipse at 80% 20%, #facd72 0%, transparent 45%),\n  linear-gradient(140deg, #1f1b1a 0%, #3F3938 60%, #c9a155 110%); }\n.v-river { background:\n  radial-gradient(ellipse at 20% 80%, #e8d0b0 0%, transparent 55%),\n  linear-gradient(140deg, #2a2625 0%, #4b3522 50%, #d3b78f 110%); }\n.v-loft { background:\n  radial-gradient(ellipse at 50% 50%, #facd72 0%, transparent 50%),\n  linear-gradient(140deg, #3F3938 0%, #6a3a1c 70%, #c9a155 130%); }\n.v-library { background:\n  radial-gradient(ellipse at 30% 40%, #c9a155 0%, transparent 50%),\n  linear-gradient(140deg, #2a2120 0%, #3F3938 50%, #6a3a1c 100%); }\n.v-suite { background:\n  radial-gradient(ellipse at 50% 30%, #facd72 0%, transparent 45%),\n  linear-gradient(160deg, #1f1b1a 0%, #5e0001 60%, #8a4b1c 110%); }\n.v-garret { background:\n  radial-gradient(ellipse at 70% 60%, #8a4b1c 0%, transparent 55%),\n  linear-gradient(140deg, #3F3938 0%, #4b3522 70%, #d3b78f 130%); }\n.v-cardinal { background:\n  radial-gradient(ellipse at 50% 50%, #840001 0%, transparent 55%),\n  linear-gradient(140deg, #1f1b1a 0%, #3F3938 60%, #5e0001 110%); }\n.v-magnolia { background:\n  radial-gradient(ellipse at 40% 60%, #f1e1c9 0%, transparent 50%),\n  linear-gradient(140deg, #3F3938 0%, #6a3a1c 60%, #d3b78f 110%); }\n.v-oak { background:\n  radial-gradient(ellipse at 60% 40%, #c9a155 0%, transparent 45%),\n  linear-gradient(140deg, #2c1d1d 0%, #4b3522 70%, #8a6740 110%); }\n.v-rooftop { background:\n  radial-gradient(ellipse at 75% 30%, #facd72 0%, transparent 50%),\n  radial-gradient(ellipse at 20% 80%, #5e0001 0%, transparent 55%),\n  linear-gradient(165deg, #1f1b1a 0%, #2c1d1d 45%, #6a3a1c 100%); }\n.v-brass { background:\n  radial-gradient(ellipse at 30% 30%, #facd72 0%, transparent 45%),\n  linear-gradient(140deg, #1f1b1a 0%, #4b3522 60%, #c9a155 110%); }\n.v-first { background:\n  radial-gradient(ellipse at 50% 50%, #6a3a1c 0%, transparent 60%),\n  linear-gradient(140deg, #2a2625 0%, #3F3938 60%, #5e0001 110%); }\n.v-second { background:\n  radial-gradient(ellipse at 25% 70%, #d3b78f 0%, transparent 55%),\n  linear-gradient(140deg, #3F3938 0%, #5e4a3a 60%, #8a4b1c 100%); }\n.v-third { background:\n  radial-gradient(ellipse at 70% 30%, #facd72 0%, transparent 50%),\n  linear-gradient(140deg, #1f1b1a 0%, #3F3938 60%, #8a6740 110%); }\n\n/* Generic photo placeholder (Explore Downtown) */\n.photo-ph {\n  position: relative; overflow: hidden;\n  background: var(--cr-charcoal);\n}\n.photo-ph .v { position: absolute; inset: 0; }\n.photo-ph .p {\n  position: absolute; inset: 0;\n  background: url(\"69e36d65-002d-4569-85c7-70b06417028a\") center/180px;\n  opacity: calc(var(--pattern-opacity) * 1.2);\n}\n\n/* ---------- Featured pull-row (Home) ---------- */\n.featured-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }\n\n/* ---------- Gallery (Home) ---------- */\n.gallery {\n  display: grid; gap: 14px;\n  grid-template-columns: repeat(6, 1fr);\n  grid-auto-rows: 180px;\n}\n.g-cell {\n  position: relative; overflow: hidden; border-radius: 14px;\n  box-shadow: var(--shadow-1);\n}\n.g-cell .v { position: absolute; inset: 0; transition: transform var(--dur-4) var(--ease-out); }\n.g-cell:hover .v { transform: scale(1.05); }\n.g-cell .p {\n  position: absolute; inset: 0;\n  background: url(\"69e36d65-002d-4569-85c7-70b06417028a\") center/180px;\n  opacity: calc(var(--pattern-opacity) * 1.2);\n}\n.g-cell .cap {\n  position: absolute; left: 18px; bottom: 16px;\n  font-family: var(--font-display); font-style: italic;\n  color: var(--cr-cream); font-size: 16px;\n  text-shadow: 0 2px 14px rgba(0,0,0,0.7);\n  letter-spacing: 0.01em;\n}\n.g-1 { grid-column: span 3; grid-row: span 2; }\n.g-2 { grid-column: span 3; grid-row: span 1; }\n.g-3 { grid-column: span 2; grid-row: span 1; }\n.g-4 { grid-column: span 1; grid-row: span 1; }\n.g-5 { grid-column: span 2; grid-row: span 2; }\n.g-6 { grid-column: span 2; grid-row: span 1; }\n.g-7 { grid-column: span 2; grid-row: span 1; }\n.g-8 { grid-column: span 4; grid-row: span 1; }\n\n/* ---------- Split (story / explore / group) ---------- */\n.split {\n  display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 96px; align-items: center;\n}\n.split.reverse { grid-template-columns: 0.95fr 1.05fr; }\n.split.reverse > :first-child { order: 2; }\n.split.reverse > :last-child  { order: 1; }\n.split-img {\n  aspect-ratio: 4/5; border-radius: 22px;\n  position: relative; overflow: hidden;\n  box-shadow: var(--shadow-3);\n}\n.split-img .v { position: absolute; inset: 0; }\n.split-img .p {\n  position: absolute; inset: 0;\n  background: url(\"69e36d65-002d-4569-85c7-70b06417028a\") center/240px;\n  opacity: var(--pattern-opacity);\n}\n.split-img .stamp {\n  position: absolute; right: 26px; bottom: 22px;\n  height: 60px; opacity: 0.92;\n}\n.split-img .cap {\n  position: absolute; left: 26px; bottom: 22px;\n  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;\n  color: var(--cr-gold);\n}\n\n/* ---------- Group bookings band ---------- */\n.group-band {\n  position: relative; overflow: hidden;\n  background: var(--cr-ink); color: var(--cr-cream);\n}\n.group-band::before {\n  content:\"\"; position: absolute; inset: 0;\n  background:\n    radial-gradient(ellipse at 80% 30%, rgba(132,0,1,0.55) 0%, transparent 55%),\n    radial-gradient(ellipse at 20% 70%, rgba(106,58,28,0.55) 0%, transparent 60%);\n}\n.group-band::after {\n  content:\"\"; position: absolute; inset: 0;\n  background: url(\"69e36d65-002d-4569-85c7-70b06417028a\") center/360px;\n  opacity: calc(var(--pattern-opacity) * 1.4);\n}\n.group-band .inner {\n  position: relative; max-width: 980px; margin: 0 auto;\n  padding: 140px 40px; text-align: center;\n}\n.group-band h2 {\n  font-family: var(--font-display); color: var(--cr-cream);\n  font-size: clamp(44px, 5.6vw, 84px); line-height: 1.02;\n  letter-spacing: -0.014em; margin: 24px 0 22px;\n  font-weight: 500;\n}\n.group-band h2 em { font-style: italic; color: var(--cr-gold); font-weight: 400; }\n.group-band p {\n  font-size: 18px; line-height: 1.6; max-width: 56ch;\n  margin: 0 auto 36px; color: var(--fg-on-dark-2);\n}\n\n/* ---------- Tweaks affordance link ---------- */\n.tweaks-affordance {\n  position: fixed; right: 20px; bottom: 20px; z-index: 70;\n  background: var(--cr-ink); color: var(--cr-cream);\n  border: 1px solid rgba(250,205,114,0.3);\n  border-radius: 999px;\n  padding: 11px 18px 11px 14px;\n  font-size: 11px; font-weight: 600; letter-spacing: 0.18em;\n  text-transform: uppercase; text-decoration: none;\n  display: none; align-items: center; gap: 10px;\n  box-shadow: var(--shadow-3);\n  transition: background var(--dur-2) var(--ease-out);\n}\n.tweaks-affordance:hover { background: var(--cr-charcoal); color: var(--cr-gold); }\n.tweaks-affordance .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--cr-gold); }\n\n/* ============================ Responsive ============================ */\n@media (max-width: 1100px) {\n  .footer-top { grid-template-columns: 1fr 1fr; gap: 48px; }\n  .split, .split.reverse { grid-template-columns: 1fr; gap: 56px; }\n  .split.reverse > :first-child { order: 1; }\n  .listings-grid.cols-2 { grid-template-columns: 1fr; gap: 40px; }\n  .listings-grid.cols-3 { grid-template-columns: 1fr 1fr; }\n  .featured-row { grid-template-columns: 1fr; gap: 24px; }\n  .gallery { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 160px; }\n  .g-1 { grid-column: span 4; grid-row: span 2; }\n  .g-2 { grid-column: span 4; }\n  .g-8 { grid-column: span 4; }\n  .g-3, .g-5, .g-6, .g-7 { grid-column: span 2; }\n  .g-4 { grid-column: span 2; }\n}\n@media (max-width: 780px) {\n  .container, .container-wide, .container-tight { padding: 0 24px; }\n  .section { padding: 80px 0; }\n  .nav-links { display: none; }\n  .nav-toggle { display: inline-flex; }\n  .footer-top { grid-template-columns: 1fr; }\n  .footer-bottom { flex-direction: column; gap: 14px; }\n  /* comfortable tap targets on touch screens */\n  .footer ul { gap: 2px; }\n  .footer ul li a { display: inline-block; padding: 9px 0; }\n  .footer .addr a { display: inline-block; padding: 6px 0; }\n  .footer-bottom .social a { padding: 8px 0; }\n  .listings-grid.cols-3 { grid-template-columns: 1fr; }\n  .page-banner { padding: 180px 0 80px; }\n  .group-band .inner { padding: 96px 24px; }\n}\n<\/style>\n<style>/* Tweaks panel — styled to match the Cardinal Reserve brand */\n.tweaks-panel {\n  position: fixed; right: 20px; bottom: 20px; z-index: 80;\n  width: 340px;\n  background: var(--cr-ink); color: var(--cr-cream);\n  border: 1px solid rgba(250,205,114,0.22);\n  border-radius: 18px;\n  box-shadow: 0 24px 56px rgba(0,0,0,0.55), 0 6px 18px rgba(0,0,0,0.35);\n  font-family: var(--font-body);\n  transform: translateY(16px); opacity: 0; pointer-events: none;\n  transition: transform .26s var(--ease-out), opacity .26s var(--ease-out);\n  overflow: hidden;\n}\n.tweaks-panel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }\n.tweaks-panel .tp-bar {\n  display: flex; justify-content: space-between; align-items: center;\n  padding: 16px 18px 14px;\n  border-bottom: 1px solid rgba(229,225,220,0.12);\n}\n.tweaks-panel .tp-title {\n  display: flex; align-items: center; gap: 10px;\n  font-size: 11px; font-weight: 600;\n  letter-spacing: 0.22em; text-transform: uppercase;\n  color: var(--cr-gold);\n}\n.tweaks-panel .tp-title .dot {\n  width: 8px; height: 8px; border-radius: 999px; background: var(--cr-gold);\n  box-shadow: 0 0 12px rgba(250,205,114,0.6);\n}\n.tweaks-panel .tp-close {\n  background: none; border: none; color: var(--cr-cream); opacity: 0.6;\n  font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px;\n}\n.tweaks-panel .tp-close:hover { opacity: 1; color: var(--cr-gold); }\n.tweaks-panel .tp-body { padding: 18px; }\n.tweaks-panel .tp-row { margin-bottom: 16px; }\n.tweaks-panel .tp-row label {\n  display: block; font-size: 10px; font-weight: 600;\n  letter-spacing: 0.20em; text-transform: uppercase;\n  color: rgba(229,225,220,0.62); margin-bottom: 8px;\n}\n.tweaks-panel .tp-group {\n  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px;\n  background: rgba(229,225,220,0.06);\n  border: 1px solid rgba(229,225,220,0.08);\n  border-radius: 10px; padding: 4px;\n}\n.tweaks-panel .tp-group button {\n  font-family: var(--font-body); font-size: 11px; font-weight: 600;\n  letter-spacing: 0.10em; text-transform: uppercase;\n  color: rgba(229,225,220,0.78);\n  background: transparent; border: none;\n  padding: 9px 6px; border-radius: 7px; cursor: pointer;\n  transition: background .15s var(--ease-out), color .15s var(--ease-out);\n}\n.tweaks-panel .tp-group button:hover { color: var(--cr-gold); }\n.tweaks-panel .tp-group button.on {\n  background: var(--cr-cardinal);\n  color: #fff;\n  box-shadow: 0 2px 6px rgba(132,0,1,0.45);\n}\n.tweaks-panel .tp-reset {\n  width: 100%; margin-top: 6px;\n  background: transparent; color: rgba(229,225,220,0.55);\n  border: 1px solid rgba(229,225,220,0.12);\n  border-radius: 999px; padding: 11px;\n  font-size: 10px; font-weight: 600;\n  letter-spacing: 0.20em; text-transform: uppercase;\n  cursor: pointer;\n  transition: color .15s var(--ease-out), border-color .15s var(--ease-out);\n}\n.tweaks-panel .tp-reset:hover { color: var(--cr-gold); border-color: var(--cr-gold); }\n\n/* Light/inverse hero sections — applied when tweak says so */\n.page-banner.as-light {\n  background: var(--cr-tan-soft);\n  color: var(--fg-1);\n}\n.page-banner.as-light::before { opacity: calc(var(--pattern-opacity) * 0.6); }\n.page-banner.as-light::after  { background: linear-gradient(to bottom, transparent, rgba(229,225,220,0.5)); }\n.page-banner.as-light h1 { color: var(--fg-1); }\n.page-banner.as-light h1 em { color: var(--cr-cardinal-current); }\n.page-banner.as-light p.lede { color: var(--fg-2); }\n.page-banner.as-light .crumbs { color: var(--fg-3); }\n.page-banner.as-light .crumbs a { color: var(--fg-2); }\n.page-banner.as-light .crumbs span { color: var(--cr-cardinal-current); }\n\n/* Hero sections (home) */\n.hero-section.as-light .hero-fullbleed .hero-content { color: var(--fg-1); }\n<\/style>\n<style>\n  .faq-wrap { padding: 96px 0 120px; }\n  .faq-layout { display: grid; grid-template-columns: 0.9fr 1.3fr; gap: 96px; align-items: start; }\n  .faq-side { position: sticky; top: 120px; }\n  .faq-side h2 { font-family: var(--font-display); font-size: clamp(38px, 4.2vw, 60px); line-height: 1.04; letter-spacing: -0.014em; margin: 22px 0 22px; }\n  .faq-side h2 em { font-style: italic; color: var(--cr-cardinal-current); font-weight: 400; }\n  .faq-side p { font-size: 16px; line-height: 1.65; color: var(--fg-2); margin-bottom: 28px; max-width: 42ch; }\n  .faq-side .qlinks { display: flex; flex-direction: column; gap: 4px; }\n  .faq-side .qlinks a {\n    font-size: 11px; font-weight: 600; letter-spacing: 0.20em; text-transform: uppercase;\n    color: var(--fg-2); text-decoration: none; padding: 10px 0;\n    border-bottom: 1px solid var(--border-soft);\n    display: flex; justify-content: space-between; align-items: center;\n    transition: color var(--dur-2) var(--ease-out);\n  }\n  .faq-side .qlinks a:hover, .faq-side .qlinks a.on { color: var(--cr-cardinal-current); }\n  .faq-side .qlinks a .ct { color: var(--cr-gold-deep); font-size: 10px; }\n\n  .faq-group { margin-bottom: 72px; }\n  .faq-group .gh {\n    display: flex; align-items: baseline; justify-content: space-between;\n    border-bottom: 1px solid var(--border-soft); padding-bottom: 14px; margin-bottom: 18px;\n  }\n  .faq-group .gh .label { font-family: var(--font-display); font-size: 28px; letter-spacing: -0.008em; }\n  .faq-group .gh .marker { font-size: 11px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cr-gold-deep); }\n\n  .qa {\n    border-bottom: 1px solid var(--border-soft);\n    transition: background var(--dur-2) var(--ease-out);\n  }\n  .qa[open] { background: var(--cr-paper); }\n  .qa summary {\n    list-style: none; cursor: pointer;\n    padding: 22px 4px; display: flex; align-items: flex-start; gap: 18px;\n    font-family: var(--font-display); font-size: 22px; line-height: 1.3; letter-spacing: -0.005em;\n    color: var(--fg-1);\n  }\n  .qa summary::-webkit-details-marker { display: none; }\n  .qa summary .num {\n    font-family: var(--font-body); font-size: 11px; font-weight: 600;\n    letter-spacing: 0.20em; text-transform: uppercase; color: var(--cr-gold-deep);\n    flex-shrink: 0; margin-top: 8px; min-width: 36px;\n  }\n  .qa summary .q { flex: 1; }\n  .qa summary .ic {\n    flex-shrink: 0; width: 28px; height: 28px;\n    border-radius: 999px; border: 1px solid var(--border-strong);\n    display: flex; align-items: center; justify-content: center;\n    color: var(--cr-cardinal-current); font-size: 16px; font-weight: 300;\n    transition: transform var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);\n    margin-top: 6px;\n  }\n  .qa[open] summary .ic { transform: rotate(45deg); background: var(--cr-cardinal); color: #fff; border-color: var(--cr-cardinal); }\n  .qa .a {\n    padding: 0 4px 26px 58px; max-width: 60ch;\n    color: var(--fg-2); font-size: 16px; line-height: 1.7;\n  }\n  .qa .a p { margin: 0 0 12px; }\n  .qa .a p:last-child { margin-bottom: 0; }\n  .qa .a strong { color: var(--fg-1); font-weight: 600; }\n\n  /* Still-have-questions banner */\n  .have-q { background: var(--cr-tan-soft); }\n  .have-q .row { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; max-width: 1080px; margin: 0 auto; padding: 56px 0; }\n  .have-q h3 { font-family: var(--font-display); font-size: clamp(28px, 3vw, 40px); margin: 0 0 8px; letter-spacing: -0.008em; }\n  .have-q p { margin: 0; color: var(--fg-2); font-size: 16px; line-height: 1.6; }\n\n  @media (max-width: 1100px) {\n    .faq-layout { grid-template-columns: 1fr; gap: 48px; }\n    .faq-side { position: static; }\n    .have-q .row { grid-template-columns: 1fr; gap: 18px; }\n  }\n<\/style>\n\n<\/head>\n<body data-screen-label=\"04 FAQ\">\n\n<header class=\"nav\">\n  <div class=\"nav-inner\">\n    <a class=\"nav-brand\" href=\"/\">\n      <img class=\"nav-logo nav-logo-dark\" src=\"97522250-375f-45dd-a5ef-4170a49714ac\" alt=\"The Cardinal Reserve\">\n      <img class=\"nav-logo nav-logo-light\" src=\"61f752ba-2009-452a-bef4-5a57a9410ac5\" alt=\"\">\n    <\/a>\n    <nav class=\"nav-links\">\n      <a class=\"nav-link\" href=\"/\">Home<\/a>\n      <a class=\"nav-link\" href=\"/listings\">Listings<\/a>\n      <a class=\"nav-link\" href=\"/explore\">Explore<\/a>\n      <a class=\"nav-link\" href=\"/faq\" aria-current=\"page\">FAQ<\/a>\n      <a class=\"nav-link\" href=\"/contact\">Contact<\/a>\n      <a class=\"nav-cta\" href=\"/listings\">Reserve<\/a>\n    <\/nav>\n    <button class=\"nav-toggle\" type=\"button\" aria-label=\"Open menu\" aria-expanded=\"false\" aria-controls=\"mobile-menu\">\n      <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path class=\"bar-top\" d=\"M3 6h18\"/><path class=\"bar-mid\" d=\"M3 12h18\"/><path class=\"bar-bot\" d=\"M3 18h18\"/><\/svg>\n    <\/button>\n  <\/div>\n<\/header>\n\n<div class=\"mobile-menu\" id=\"mobile-menu\" aria-hidden=\"true\">\n  <nav>\n    <a href=\"/\">Home<\/a>\n    <a href=\"/listings\">Listings<\/a>\n    <a href=\"/explore\">Explore<\/a>\n    <a href=\"/faq\" aria-current=\"page\">FAQ<\/a>\n    <a href=\"/contact\">Contact<\/a>\n    <a class=\"mm-cta\" href=\"/listings\">Reserve<\/a>\n  <\/nav>\n<\/div>\n\n<section class=\"page-banner\">\n  <div class=\"inner\">\n    <div class=\"crumbs\"><a href=\"/\">The Cardinal Reserve<\/a> <span>/<\/span> Frequently Asked<\/div>\n    <div class=\"eyebrow-rule\">Before You Arrive<\/div>\n    <h1>The things <em>worth knowing.<\/em><\/h1>\n    <p class=\"lede\">Parking, check-in, pets, late nights, the elevator, and what to do if you forget a charger. Anything missed below — your host is a phone call away.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"faq-wrap\">\n  <div class=\"container\">\n    <div class=\"faq-layout\">\n\n      <aside class=\"faq-side\">\n        <div class=\"eyebrow-rule\">Quick jump<\/div>\n        <h2>Five sections, <em>twenty-one answers.<\/em><\/h2>\n        <p>We've grouped questions the way guests actually ask them — arrival first, the building second, the room third, then policies and the practical. If you don't see your question, the host answers the phone.<\/p>\n        <div class=\"qlinks\">\n          <a href=\"#arrival\" class=\"on\">Arrival &amp; Check-in <span class=\"ct\">5<\/span><\/a>\n          <a href=\"#building\">The Building <span class=\"ct\">4<\/span><\/a>\n          <a href=\"#room\">Inside Your Room <span class=\"ct\">4<\/span><\/a>\n          <a href=\"#policies\">Policies <span class=\"ct\">5<\/span><\/a>\n          <a href=\"#practical\">Practical <span class=\"ct\">3<\/span><\/a>\n        <\/div>\n      <\/aside>\n\n      <div class=\"faq-content\">\n\n        <!-- Arrival & Check-in -->\n        <div class=\"faq-group\" id=\"arrival\">\n          <div class=\"gh\"><div class=\"label\">Arrival &amp; Check-in<\/div><div class=\"marker\">§ 01<\/div><\/div>\n\n          <details class=\"qa\" open=\"\">\n            <summary><span class=\"num\">01.<\/span><span class=\"q\">How does check-in work?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>The morning of your arrival, you'll receive a text with your room number and a four-digit code for the front door on Frederica Street. The same code opens your room. There's no front desk.<\/p>\n              <p><strong>Standard check-in is 4:00 PM<\/strong>; check-out is 11:00 AM. If your room is already turned over, the door will let you in earlier. Early check-in or late check-out is $75.00.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">02.<\/span><span class=\"q\">Where do I park?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>There's a large parking lot on the side and back of the building, with access from Frederica Street and St. Ann Street. Parking is unassigned — take any open space. Street parking is also available.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">03.<\/span><span class=\"q\">What if I'm arriving late?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Anytime is fine. The code works 24/7 and the building's interior is well-lit overnight.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">04.<\/span><span class=\"q\">Can I check in earlier than 4 PM?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Ask the day before and we'll do our best based on turnover schedule. A guaranteed early check-in (or a late check-out) is $75.00.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">05.<\/span><span class=\"q\">Is there someone on site?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>The host is on call throughout your stay. There's no front desk in the building, but the host answers by phone and text; the number is on the welcome card in your suite.<\/p>\n            <\/div>\n          <\/details>\n        <\/div>\n\n        <!-- The Building -->\n        <div class=\"faq-group\" id=\"building\">\n          <div class=\"gh\"><div class=\"label\">The Building<\/div><div class=\"marker\">§ 02<\/div><\/div>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">06.<\/span><span class=\"q\">Is there an elevator?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Yes — an elevator with access to the second and third floors, reached through the entrance on the south side of the building. There's a stairwell at both the front and back.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">07.<\/span><span class=\"q\">What's on the ground floor?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>The ground floor has been set aside for retail and is currently under construction.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">08.<\/span><span class=\"q\">Are there shared amenities for guests?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>The only common areas are two large balconies — one on the second floor and one on the third — shared by all guests.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">09.<\/span><span class=\"q\">Is the building accessible?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>The elevator serves the second and third floors and the ground-floor entrance is step-free from Frederica Street. Showers have a small step-over threshold; the building does not currently have roll-in showers. If accessibility is a factor, let us know which suite you're considering and we'll send dimensions and photographs.<\/p>\n            <\/div>\n          <\/details>\n        <\/div>\n\n        <!-- Inside Your Room -->\n        <div class=\"faq-group\" id=\"room\">\n          <div class=\"gh\"><div class=\"label\">Inside Your Room<\/div><div class=\"marker\">§ 03<\/div><\/div>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">10.<\/span><span class=\"q\">What's in every room?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Every suite has a king or queen bed with crisp, clean linens, a small writing desk and chair, and high-speed Wi-Fi. No soaking tubs.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">11.<\/span><span class=\"q\">Is there a kitchen?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Yes — each room has a full, high-end kitchen.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">12.<\/span><span class=\"q\">Are linens and towels included?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Yes. Fresh linens and two sets of towels per guest. Midweek refresh available on request for stays longer than four nights.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">13.<\/span><span class=\"q\">How's the Wi-Fi?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Every room has its own high-speed Wi-Fi. The network name and password are on the welcome card.<\/p>\n            <\/div>\n          <\/details>\n        <\/div>\n\n        <!-- Policies -->\n        <div class=\"faq-group\" id=\"policies\">\n          <div class=\"gh\"><div class=\"label\">Policies<\/div><div class=\"marker\">§ 04<\/div><\/div>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">14.<\/span><span class=\"q\">What's the cancellation policy?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Cancellation terms are shown at checkout when you book. Contact the host directly for stays longer than seven nights or whole-building reservations.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">15.<\/span><span class=\"q\">Do you allow pets?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>No pets. For long-term stays, call the host to see if we can make an exception.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">16.<\/span><span class=\"q\">Is smoking permitted?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>No smoking anywhere in the building. Cannabis and vaping are treated the same as cigarettes. A $400 deep-clean charge applies if a suite smells of smoke at checkout.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">17.<\/span><span class=\"q\">What about noise and parties?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>The building is for sleeping. Quiet hours are 10 PM to 6 AM, and we ask that gatherings of more than the room's listed sleeping capacity not happen inside.<\/p>\n              <p>For wedding parties or buyouts, the rules relax — see <a href=\"/contact\">group bookings<\/a>.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">18.<\/span><span class=\"q\">Is the building good for kids?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Yes. A pack-n-play and a high chair are available on request — just mention it in your booking. Smothers Park, a short walk away, has the city's best playground.<\/p>\n            <\/div>\n          <\/details>\n        <\/div>\n\n        <!-- Practical -->\n        <div class=\"faq-group\" id=\"practical\">\n          <div class=\"gh\"><div class=\"label\">Practical<\/div><div class=\"marker\">§ 05<\/div><\/div>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">19.<\/span><span class=\"q\">I forgot a charger / toothbrush / something — what now?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Give the host a call. Owensboro has a 24-hour Walgreens on Frederica and a full-service grocery a short drive away.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">20.<\/span><span class=\"q\">Can I get into the room before checkout to grab something I forgot?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>If you left something behind after check-out, give the host a call.<\/p>\n            <\/div>\n          <\/details>\n\n          <details class=\"qa\">\n            <summary><span class=\"num\">21.<\/span><span class=\"q\">Do you take group bookings or whole-building buyouts?<\/span><span class=\"ic\">+<\/span><\/summary>\n            <div class=\"a\">\n              <p>Yes — whole-building reservations provide exclusive use of all fifteen suites and the two common balconies. Available for weddings, corporate retreats, family reunions, and bachelor or bachelorette weekends. Reach out through the <a href=\"/contact\">contact form<\/a> with dates and approximate group size.<\/p>\n            <\/div>\n          <\/details>\n        <\/div>\n\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"have-q\">\n  <div class=\"container\">\n    <div class=\"row\">\n      <div>\n        <h3>Still got a question?<\/h3>\n        <p>The host answers the phone. Texts faster, calls slower, emails on weekends.<\/p>\n      <\/div>\n      <a class=\"btn btn-primary\" href=\"/contact\">Reach a host <span class=\"arrow\">→<\/span><\/a>\n    <\/div>\n  <\/div>\n<\/section>\n\n<footer class=\"footer\">\n  <div class=\"container\">\n    <div class=\"footer-top\">\n      <div>\n        <img class=\"f-logo\" src=\"21549983-e414-4f65-b242-851748d21fbf\" alt=\"The Cardinal Reserve\">\n        <div class=\"addr\">\n          No. 700 Frederica Street<br>Owensboro, Kentucky 42301<br>\n          <a href=\"tel:+12703142545\">(270) 314-2545<\/a>\n        <\/div>\n      <\/div>\n      <div><h5>Visit<\/h5><ul>\n        <li><a href=\"/listings\">All listings<\/a><\/li>\n        <li><a href=\"/contact\">Group bookings<\/a><\/li>\n      <\/ul><\/div>\n      <div><h5>The Reserve<\/h5><ul>\n        <li><a href=\"/explore\">Explore downtown<\/a><\/li>\n        <li><a href=\"/faq\">FAQ<\/a><\/li>\n        <li><a href=\"/contact\">Contact a host<\/a><\/li>\n        <li><a href=\"/faq\">House rules<\/a><\/li>\n      <\/ul><\/div>\n      <div><h5>Stay in touch<\/h5><ul>\n        <li><a href=\"https://www.facebook.com/profile.php?id=61586850372555\" target=\"_blank\" rel=\"noreferrer\">Facebook<\/a><\/li>\n        <li><a href=\"mailto:contact@thecardinalreserve.com\">contact@thecardinalreserve.com<\/a><\/li>\n        <li><a href=\"tel:+12703142545\">(270) 314-2545<\/a><\/li>\n      <\/ul><\/div>\n    <\/div>\n    <div class=\"footer-bottom\">\n      <span>© 2026 The Cardinal Reserve · Owensboro, KY<\/span>\n      <div class=\"social\">\n        <a href=\"https://www.facebook.com/profile.php?id=61586850372555\" target=\"_blank\" rel=\"noreferrer\" aria-label=\"Facebook\"><svg viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z\"><\/path><\/svg> Facebook<\/a>\n        <a href=\"mailto:contact@thecardinalreserve.com\"><svg viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\/rect><path d=\"m3 7 9 6 9-6\"><\/path><\/svg> Email<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/footer>\n\n<script src=\"bc3ac71c-a43d-494f-b119-6731e1614008\"><\/script>\n<script>\n  // Highlight active section in side nav\n  const links = document.querySelectorAll('.faq-side .qlinks a');\n  const groups = [...document.querySelectorAll('.faq-group')];\n  function update() {\n    let active = links[0];\n    groups.forEach(g => {\n      if (g.getBoundingClientRect().top - 200 < 0) {\n        const id = g.id;\n        const m = [...links].find(a => a.getAttribute('href') === '#' + id);\n        if (m) active = m;\n      }\n    });\n    links.forEach(a => a.classList.toggle('on', a === active));\n  }\n  window.addEventListener('scroll', update, { passive: true });\n  update();\n<\/script>\n\n\n<script>\n(function () {\n  var t = document.querySelector('.nav-toggle');\n  var m = document.getElementById('mobile-menu');\n  if (!t || !m) return;\n  function setOpen(open) {\n    m.classList.toggle('open', open);\n    m.setAttribute('aria-hidden', open ? 'false' : 'true');\n    t.setAttribute('aria-expanded', open ? 'true' : 'false');\n    t.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');\n    document.body.classList.toggle('menu-open', open);\n  }\n  setOpen(false);\n  t.addEventListener('click', function () { setOpen(!m.classList.contains('open')); });\n  m.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });\n  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });\n  window.addEventListener('resize', function () { if (window.innerWidth > 980) setOpen(false); });\n})();\n<\/script>\n\n<\/body><\/html>"
